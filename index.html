
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bolívar Eco-Calculator</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #ecfdf5;
    color: #064e3b;
    padding: 35px 15px;
}

.container {
    max-width: 650px;
    margin: auto;
}

header {
    text-align: center;
    margin-bottom: 25px;
}

h1 { color: #047857; }

.subtitle { color: #64748b; }

.card {
    background: white;
    padding: 28px;
    border-radius: 20px;
    margin-bottom: 20px;
    box-shadow: 0 8px 25px #00000012;
}

h2 { color: #065f46; }

label {
    display: block;
    margin: 15px 0 8px;
    font-weight: bold;
}

select, input {
    width: 100%;
    padding: 12px;
    border: 1px solid #a7f3d0;
    border-radius: 10px;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 18px;
    border: none;
    border-radius: 12px;
    background: #059669;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover { background: #047857; }

.result {
    background: #d1fae5;
    padding: 15px;
    border-radius: 12px;
    margin-top: 12px;
}

.language {
    max-width: 200px;
    margin: 12px auto;
}

#certificate { display: none; }

footer {
    text-align: center;
    color: #64748b;
    font-size: 13px;
}

@media print {
    body {
        background: white;
        padding: 0;
    }

    .container { display: none; }

    #certificate {
        display: block;
        border: 4px solid #059669;
        border-radius: 15px;
        padding: 45px;
        margin: 35px;
        text-align: center;
        color: #064e3b;
    }

    #certificate h1 {
        font-size: 30px;
    }

    #certificate p {
        font-size: 20px;
        margin: 25px 0;
    }
}
</style>
</head>

<body>

<div class="container">

<header>
    <h1>🌱 Bolívar Eco-Calculator</h1>
    <p class="subtitle" data-i18n="subtitle">
        Calcula tu impacto ambiental
    </p>

    <select class="language" id="language"
            onchange="changeLanguage()">
        <option value="es">Español</option>
        <option value="en">English</option>
    </select>
</header>

<section class="card">
    <h2 data-i18n="calculator">🌍 Calculadora Ambiental</h2>

    <label for="transporte" data-i18n="transport">
        Transporte al colegio
    </label>

    <select id="transporte">
        <option value="bus" data-i18n="bus">Bus</option>
        <option value="privado" data-i18n="private">Carro privado</option>
        <option value="compartido" data-i18n="shared">Carro compartido</option>
        <option value="bici" data-i18n="bike">Bicicleta/Caminando</option>
    </select>

    <label for="papel" data-i18n="paper">
        Hojas usadas al día
    </label>
    <input type="number" id="papel" min="0" value="0">

    <label for="reciclaje" data-i18n="recycling">
        Nivel de reciclaje
    </label>

    <select id="reciclaje">
        <option value="bajo" data-i18n="low">Bajo</option>
        <option value="medio" data-i18n="medium">Medio</option>
        <option value="alto" data-i18n="high">Alto</option>
    </select>

    <button onclick="calculateAndTranslate()"
            data-i18n="calculate">
        🌿 Calcular impacto
    </button>
</section>

<section class="card">
    <h2 data-i18n="results">📊 Tus resultados</h2>

    <div class="result">
        <p id="co2">CO₂ semanal: --</p>
    </div>

    <div class="result">
        <p id="puntos">Eco-Points: --</p>
    </div>

    <button onclick="printReport()"
            data-i18n="print">
        🖨️ Imprimir / Guardar Reporte PDF
    </button>
</section>

<footer>Bolívar Eco-Calculator | Proyecto Escolar</footer>

</div>

<!-- Certificado para impresión -->
<div id="certificate">
    <h1 id="certTitle">🌱 Certificado Ecológico</h1>
    <h2>Bolívar Eco-Calculator</h2>
    <p id="certDate"></p>
    <p id="certCO2"></p>
    <p id="certPoints"></p>
    <p id="certFooter"></p>
</div>

<script src="actions.js"></script>

<script>
let currentLanguage = "es";
let hasCalculated = false;

const translations = {
    es: {
        subtitle: "Calcula tu impacto ambiental",
        calculator: "🌍 Calculadora Ambiental",
        transport: "Transporte al colegio",
        bus: "Bus",
        private: "Carro privado",
        shared: "Carro compartido",
        bike: "Bicicleta/Caminando",
        paper: "Hojas usadas al día",
        recycling: "Nivel de reciclaje",
        low: "Bajo",
        medium: "Medio",
        high: "Alto",
        calculate: "🌿 Calcular impacto",
        results: "📊 Tus resultados",
        print: "🖨️ Imprimir / Guardar Reporte PDF",
        co2: "CO₂ semanal: ",
        points: "Eco-Points: ",
        certificate: "🌱 Certificado Ecológico",
        date: "Fecha: ",
        footer: "Comprometidos con un futuro sostenible",
        error: "Ingresa una cantidad válida de hojas."
    },
    en: {
        subtitle: "Calculate your environmental impact",
        calculator: "🌍 Environmental Calculator",
        transport: "Transportation to school",
        bus: "Bus",
        private: "Private car",
        shared: "Shared car",
        bike: "Bicycle/Walking",
        paper: "Sheets of paper used per day",
        recycling: "Recycling level",
        low: "Low",
        medium: "Medium",
        high: "High",
        calculate: "🌿 Calculate impact",
        results: "📊 Your results",
        print: "🖨️ Print / Save PDF Report",
        co2: "Weekly CO₂: ",
        points: "Eco-Points: ",
        certificate: "🌱 Ecological Certificate",
        date: "Date: ",
        footer: "Committed to a sustainable future",
        error: "Enter a valid number of sheets."
    }
};

function changeLanguage() {
    currentLanguage =
        document.getElementById("language").value;

    document.documentElement.lang = currentLanguage;

    document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.dataset.i18n;
        el.textContent = translations[currentLanguage][key];
    });

    if (hasCalculated) {
        updateResults();
    }
}

function calculateAndTranslate() {
    const paperInput = document.getElementById("papel");
    const paper = Number(paperInput.value);

    if (paperInput.value.trim() === "" ||
        !Number.isInteger(paper) || paper < 0) {
        alert(translations[currentLanguage].error);
        return;
    }

    calcular();
    hasCalculated = true;
    updateResults();
}

function updateResults() {
    const t = translations[currentLanguage];

    const co2Element = document.getElementById("co2");
    const pointsElement = document.getElementById("puntos");

    const co2Value = co2Element.dataset.value;
    const pointsValue = pointsElement.dataset.value;

    if (co2Value !== undefined && pointsValue !== undefined) {
        co2Element.textContent = t.co2 + co2Value + " kg";
        pointsElement.textContent = t.points + pointsValue + "/100";
        return;
    }

    // Read the original results generated by actions.js
    const co2Match = co2Element.textContent.match(/[\d.]+(?=\s*kg)/);
    const pointsMatch = pointsElement.textContent.match(/(\d+)\s*\/\s*100/);

    if (co2Match && pointsMatch) {
        co2Element.dataset.value = co2Match[0];
        pointsElement.dataset.value = pointsMatch[1];

        co2Element.textContent = t.co2 + co2Match[0] + " kg";
        pointsElement.textContent = t.points + pointsMatch[1] + "/100";
    }
}

// Reset cached results when the user calculates again
const originalCalculate = calcular;

calcular = function() {
    delete document.getElementById("co2").dataset.value;
    delete document.getElementById("puntos").dataset.value;
    originalCalculate();
};

function printReport() {
    if (!hasCalculated) {
        alert(currentLanguage === "es"
            ? "Primero debes calcular tu impacto."
            : "Please calculate your impact first.");
        return;
    }

    const t = translations[currentLanguage];

    document.getElementById("certTitle").textContent =
        t.certificate;

    document.getElementById("certDate").textContent =
        t.date + new Date().toLocaleDateString(
            currentLanguage === "es" ? "es-CO" : "en-US"
        );

    document.getElementById("certCO2").textContent =
        document.getElementById("co2").textContent;

    document.getElementById("certPoints").textContent =
        document.getElementById("puntos").textContent;

    document.getElementById("certFooter").textContent =
        t.footer;

    window.print();
}
</script>

</body>
</html>
