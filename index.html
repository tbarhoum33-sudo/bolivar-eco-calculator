
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolívar Eco-Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #ecfdf5;
            color: #064e3b;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 650px;
            margin: auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: #047857;
            font-size: 36px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #64748b;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }

        h2 {
            color: #065f46;
            margin-top: 0;
        }

        label {
            display: block;
            font-weight: bold;
            margin: 18px 0 8px;
        }

        select, input {
            width: 100%;
            padding: 13px;
            border: 1px solid #a7f3d0;
            border-radius: 10px;
            font-size: 16px;
            background: #f8fafc;
        }

        select:focus, input:focus {
            outline: 2px solid #10b981;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 25px;
            border: none;
            border-radius: 12px;
            background: #059669;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #047857;
            transform: translateY(-2px);
        }

        .result {
            background: #d1fae5;
            border-radius: 12px;
            padding: 18px;
            margin-top: 12px;
            font-size: 18px;
            font-weight: bold;
        }

        footer {
            text-align: center;
            color: #64748b;
            margin-top: 25px;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            body {
                padding: 20px 12px;
            }

            h1 {
                font-size: 28px;
            }

            .card {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <header>
            <h1>🌱 Bolívar Eco-Calculator</h1>
            <p class="subtitle">
                Calcula tu impacto ambiental y gana Eco-Points
            </p>
        </header>

        <section class="card">
            <h2>🌍 Calculadora Ambiental</h2>

            <label for="transporte">
                Transporte al colegio
            </label>
            <select id="transporte">
                <option value="bus">Bus</option>
                <option value="privado">Carro privado</option>
                <option value="compartido">Carro compartido</option>
                <option value="bici">Bicicleta/Caminando</option>
            </select>

            <label for="papel">
                Hojas de papel usadas al día
            </label>
            <input type="number" id="papel" min="0" value="0">

            <label for="reciclaje">
                Nivel de reciclaje
            </label>
            <select id="reciclaje">
                <option value="bajo">Bajo</option>
                <option value="medio">Medio</option>
                <option value="alto">Alto</option>
            </select>

            <button type="button" onclick="calcular()">
                🌿 Calcular impacto
            </button>
        </section>

        <section class="card">
            <h2>📊 Tus resultados</h2>

            <div class="result">
                <p id="co2">CO₂ semanal: --</p>
            </div>

            <div class="result">
                <p id="puntos">Eco-Points: --</p>
            </div>
        </section>

        <footer>
            Bolívar Eco-Calculator | Proyecto Escolar
        </footer>

    </div>

    <script src="actions.js"></script>

</body>
</html>
